services:
    laravel:
      build:
        context: ./laravel
        dockerfile: Dockerfile.prod
      container_name: laravel
      volumes:
        - ./laravel:/var/www/meu-laravel
      networks: 
        - laranet

    nginx:
      build:
        context: ./nginx
        dockerfile: Dockerfile.prod
      container_name: nginx
      networks: 
        - laranet
      ports:
        - "8081:80"

networks:
  laranet:
    driver: bridge
